[package]
name = "fluxion-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "fluxion-app"
path = "native/main.rs"

[features]
default = []
app-store = []

[dependencies]
anyhow.workspace = true
async-channel = "2.5"
chrono.workspace = true
fluxion-core = { path = "../crates/fluxion-core" }
fluxion-browser = { path = "../crates/fluxion-browser" }
fluxion-runtime = { path = "../crates/fluxion-runtime" }
gpui = "=0.2.2"
gpui-component = "=0.5.1"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true
uuid.workspace = true
reqwest.workspace = true
rust-embed = { version = "8", features = ["debug-embed"] }
base64.workspace = true
minisign-verify = "0.2.5"
flate2 = "1"
tar = "0.4"
semver = "1"
sha2.workspace = true
sqlx.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSError", "NSString", "NSURL", "NSPathUtilities"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace"] }


[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }
