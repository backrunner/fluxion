name: Release macOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer without the leading v (for example 1.2.3-beta.1)'
        required: true
        type: string
      channel:
        description: 'Release channel'
        required: true
        default: stable
        type: choice
        options: [stable, beta]
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  CI: true
  CARGO_TERM_COLOR: always
  CLOUDFLARE_ACCOUNT_ID: b6754402d59fc29ee8b62119014fec89
  R2_BUCKET: fluxion-releases
  UPDATE_BASE_URL: https://assets.fluxion.alkinum.io

jobs:
  release:
    name: Build and publish macOS ${{ inputs.channel || 'tagged' }} release
    runs-on: macos-14
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release channel and version
        id: release
        env:
          TAG_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION}" ]; then
            version="${INPUT_VERSION}"
            channel="${INPUT_CHANNEL}"
          elif [[ "${TAG_NAME}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
            channel="stable"
          elif [[ "${TAG_NAME}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
            channel="beta"
          else
            echo "Unsupported release tag: ${TAG_NAME}" >&2
            exit 1
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "Unsupported release version: ${version}" >&2
            exit 1
          fi
          if [ "${channel}" = beta ] && [[ ! "${version}" =~ -beta\.[0-9]+$ ]]; then
            echo 'beta releases must use a -beta.N version' >&2
            exit 1
          fi
          if [ "${channel}" = stable ] && [[ "${version}" =~ -beta\. ]]; then
            echo 'stable releases cannot use a beta version' >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustup target add --toolchain 1.96.0 aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Check native application and core
        run: |
          cargo fmt --all -- --check
          cargo test --workspace
          node --test scripts/release/create-update-manifest.test.mjs

      - name: Build universal GPUI app and DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          VERSION: ${{ steps.release.outputs.version }}
          CHANNEL: ${{ steps.release.outputs.channel }}
        run: |
          python3 scripts/bundle-macos.py --release --universal --dmg \
            --version "${VERSION}" --channel "${CHANNEL}"

      - name: Sign update archive with existing release key
        run: |
          cargo install tauri-cli --version '^2' --locked
          cargo tauri signer sign target/universal-apple-darwin/release/bundle/Fluxion.app.tar.gz

      - name: Stage release assets and generate updater manifest
        env:
          VERSION: ${{ steps.release.outputs.version }}
          CHANNEL: ${{ steps.release.outputs.channel }}
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/fluxion-release"
          rm -rf "${stage}"
          mkdir -p "${stage}"
          find "target/universal-apple-darwin/release/bundle" -type f \
            \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.sig' \) \
            -exec cp {} "${stage}/" \;
          test -n "$(find "${stage}" -name '*.app.tar.gz' -print -quit)"
          test -n "$(find "${stage}" -name '*.app.tar.gz.sig' -print -quit)"
          (cd "${stage}" && shasum -a 256 -- * > SHA256SUMS.txt)
          node scripts/release/create-update-manifest.mjs \
            --channel "${CHANNEL}" \
            --version "${VERSION}" \
            --base-url "${UPDATE_BASE_URL}" \
            --artifacts-dir "${stage}" \
            --output "${stage}/latest.json"
          echo "ASSETS_DIR=${stage}" >> "${GITHUB_ENV}"

      - name: Upload release assets to Cloudflare R2
        env:
          CHANNEL: ${{ steps.release.outputs.channel }}
          VERSION: ${{ steps.release.outputs.version }}
        run: bash scripts/release/upload-r2.sh

      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fluxion-macos-${{ steps.release.outputs.channel }}-${{ steps.release.outputs.version }}
          path: ${{ env.ASSETS_DIR }}
          if-no-files-found: error
          retention-days: 30
